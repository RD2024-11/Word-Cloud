<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Word Cloud Poll</title>
<link rel="stylesheet" href="/style.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { width: 100%; max-width: 380px; }
  .toggle { text-align: center; margin-top: 14px; font-size: 14px; }
  .toggle a { cursor: pointer; }
  .error { color: #ff8a8a; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="card card">
  <div class="title-lg" style="text-align:center;">Word Cloud Poll</div>
  <p class="muted" style="text-align:center; margin-top:0;">Sign in to manage your events</p>

  <form id="auth-form">
    <label>Username</label>
    <input type="text" id="username" autocomplete="username" style="margin-bottom:12px;" />
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" style="margin-bottom:12px;" />
    <button type="submit" id="submit-btn" style="width:100%;">Log in</button>
    <div class="error" id="error-msg"></div>
  </form>

  <div class="toggle">
    <span id="toggle-text">Don't have an account? <a id="toggle-link">Sign up</a></span>
  </div>
</div>

<script>
  let mode = "login"; // or "signup"
  const form = document.getElementById("auth-form");
  const submitBtn = document.getElementById("submit-btn");
  const toggleLink = document.getElementById("toggle-link");
  const toggleText = document.getElementById("toggle-text");
  const errorMsg = document.getElementById("error-msg");

  toggleLink.onclick = () => {
    mode = mode === "login" ? "signup" : "login";
    submitBtn.textContent = mode === "login" ? "Log in" : "Create account";
    toggleText.innerHTML =
      mode === "login"
        ? 'Don\'t have an account? <a id="toggle-link">Sign up</a>'
        : 'Already have an account? <a id="toggle-link">Log in</a>';
    document.getElementById("toggle-link").onclick = toggleLink.onclick;
    errorMsg.textContent = "";
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.textContent = "";
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/signup";

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorMsg.textContent = data.error || "Something went wrong";
        return;
      }
      const params = new URLSearchParams(location.search);
      location.href = params.get("next") || "/events.html";
    } catch (err) {
      errorMsg.textContent = "Could not reach the server. Try again.";
    }
  });
</script>
</body>
</html>
