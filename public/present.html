<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Present — Word Cloud</title>
<link rel="stylesheet" href="/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
  header {
    padding: 24px 32px 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }
  .question-box { flex: 1; min-width: 280px; }
  .event-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  #question-display { font-size: 30px; font-weight: 800; margin: 4px 0 8px; }
  #counts { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  #counts b { color: var(--text); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"] { min-width: 240px; width: auto; flex: 1; }

  .join-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    min-width: 180px;
  }
  .join-panel #qrcode { display: inline-block; background: white; padding: 8px; border-radius: 8px; }
  .join-panel .link { margin-top: 8px; font-size: 12px; color: var(--muted); word-break: break-all; max-width: 200px; }

  main { padding: 20px 24px 40px; }
  #cloud-wrap {
    position: relative;
    width: 100%;
    max-width: 1300px;
    height: 62vh;
    min-height: 420px;
    margin: 0 auto;
  }
  .word {
    position: absolute;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    transition: left 0.4s ease, top 0.4s ease, font-size 0.4s ease, opacity 0.3s ease;
  }
  .empty-state {
    color: var(--muted);
    font-size: 18px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  footer { text-align: center; padding: 12px; }
  footer a { font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="question-box">
    <div class="event-label" id="event-label">&nbsp;</div>
    <div id="question-display">Loading…</div>
    <div id="counts">&nbsp;</div>
    <div class="controls">
      <input type="text" id="edit-question" placeholder="Edit question text…" />
      <button id="save-question-btn">Save</button>
      <button id="clear-btn" class="secondary">Clear responses</button>
    </div>
  </div>

  <div class="join-panel">
    <label style="font-size:12px; color:var(--muted); margin-bottom:6px;">Scan to answer</label>
    <div id="qrcode"></div>
    <div class="link" id="join-link"></div>
  </div>
</header>

<main>
  <div id="cloud-wrap"><div class="empty-state">Waiting for responses…</div></div>
</main>

<footer><a id="back-link" href="#">&larr; Back to dashboard</a></footer>

<script>
  const params = new URLSearchParams(location.search);
  const eventId = params.get("event");
  const qId = params.get("q");
  if (!eventId || !qId) location.href = "/";

  document.getElementById("back-link").href = `/dashboard.html?event=${eventId}`;

  const joinUrl = `${location.origin}/join.html?event=${eventId}&q=${qId}`;
  document.getElementById("join-link").textContent = joinUrl;
  new QRCode(document.getElementById("qrcode"), {
    text: joinUrl,
    width: 130,
    height: 130,
    colorDark: "#0f1115",
    colorLight: "#ffffff",
  });

  const socket = io();
  socket.emit("join-question", { eventId, qId });

  socket.on("not-found", () => {
    document.getElementById("question-display").textContent = "Question not found.";
  });

  const colors = ["#7c8cff", "#ff8a65", "#4fd1c5", "#f6ad55", "#f687b3", "#68d391"];

  // Offscreen canvas for measuring text width at a given font size.
  const measureCanvas = document.createElement("canvas");
  const mctx = measureCanvas.getContext("2d");
  function measureWidth(text, fontSize) {
    mctx.font = `800 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
    return mctx.measureText(text).width;
  }

  function boxesOverlap(a, b, pad) {
    return !(
      a.x + a.w + pad < b.x ||
      b.x + b.w + pad < a.x ||
      a.y + a.h + pad < b.y ||
      b.y + b.h + pad < a.y
    );
  }

  // Archimedean-spiral placement: biggest words placed first near the
  // center, subsequent words spiral outward until they find a free spot.
  function layoutCloud(words, containerW, containerH) {
    const centerX = containerW / 2;
    const centerY = containerH / 2;
    const placed = [];
    const pad = 8;

    return words.map((w) => {
      const width = w.width;
      const height = w.fontSize * 1.05;
      let angle = Math.random() * Math.PI * 2;
      let radius = 0;
      const angleStep = 0.32;
      const radiusStep = 2.6;
      let x, y, box;
      let attempts = 0;
      const maxAttempts = 2500;

      do {
        x = centerX + radius * Math.cos(angle) - width / 2;
        y = centerY + radius * Math.sin(angle) * 0.72 - height / 2; // flatten vertically, screens are wide
        box = { x, y, w: width, h: height };
        angle += angleStep;
        radius += radiusStep;
        attempts++;
      } while (
        attempts < maxAttempts &&
        (placed.some((p) => boxesOverlap(box, p, pad)) ||
          x < 4 ||
          y < 4 ||
          x + width > containerW - 4 ||
          y + height > containerH - 4)
      );

      // Clamp as a last resort so nothing renders fully off-screen.
      x = Math.max(4, Math.min(containerW - width - 4, x));
      y = Math.max(4, Math.min(containerH - height - 4, y));
      box = { x, y, w: width, h: height };
      placed.push(box);
      return { ...w, x, y };
    });
  }

  function renderCloud(state) {
    const wrap = document.getElementById("cloud-wrap");
    if (!state.words.length) {
      wrap.innerHTML = '<div class="empty-state">Waiting for responses…</div>';
      return;
    }
    const counts = state.words.map((w) => w.count);
    const min = Math.min(...counts);
    const max = Math.max(...counts);

    const containerW = wrap.clientWidth || 1000;
    const containerH = wrap.clientHeight || 420;

    // Precompute size + measured width for every word, largest first so
    // the spiral places dominant words closest to center.
    const sized = state.words.map((w) => {
      const scale = max === min ? 0.5 : (w.count - min) / (max - min);
      const fontSize = 16 + scale * 70; // 16px to 86px
      return { ...w, fontSize, width: measureWidth(w.display, fontSize) };
    });

    const positioned = layoutCloud(sized, containerW, containerH);

    wrap.innerHTML = "";
    positioned.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "word";
      span.style.left = w.x + "px";
      span.style.top = w.y + "px";
      span.style.fontSize = w.fontSize + "px";
      span.style.color = colors[i % colors.length];
      span.textContent = w.display;
      wrap.appendChild(span);
    });
  }

  let lastState = null;
  window.addEventListener("resize", () => {
    if (lastState) renderCloud(lastState);
  });

  socket.on("state", (state) => {
    lastState = state;
    document.getElementById("event-label").textContent = state.eventTitle;
    document.getElementById("question-display").textContent = state.text;
    document.getElementById("counts").innerHTML =
      `<b>${state.participantCount}</b> participant${state.participantCount === 1 ? "" : "s"} &middot; <b>${state.responseCount}</b> response${state.responseCount === 1 ? "" : "s"}`;
    renderCloud(state);
  });

  document.getElementById("save-question-btn").onclick = async () => {
    const text = document.getElementById("edit-question").value.trim();
    if (!text) return;
    await fetch(`/api/events/${eventId}/questions/${qId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    document.getElementById("edit-question").value = "";
  };
  document.getElementById("edit-question").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("save-question-btn").click();
  });

  document.getElementById("clear-btn").onclick = () => {
    if (confirm("Clear all responses for this question?")) {
      socket.emit("clear-words", { eventId, qId });
    }
  };
</script>

</body>
</html>
