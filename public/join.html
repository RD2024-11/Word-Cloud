<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Cloud — Answer</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #7c8cff;
    --text: #f4f5f7;
    --muted: #9aa0ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1b1f2a, #0f1115 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--panel);
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  #question {
    font-size: 24px;
    font-weight: 800;
    margin: 8px 0 24px;
  }
  input[type="text"] {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    border-radius: 12px;
    border: 1px solid #2a2f3a;
    background: #10131a;
    color: var(--text);
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  .status {
    margin-top: 16px;
    font-size: 14px;
    color: var(--muted);
    min-height: 20px;
  }
</style>
</head>
<body>

<div class="card">
  <label>Question</label>
  <div id="question">Loading…</div>
  <input type="text" id="word" maxlength="30" placeholder="Type your word…" autocomplete="off" />
  <button id="submit-btn">Submit</button>
  <div class="status" id="status"></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const room = params.get("room") || "default";

  const socket = io();
  socket.emit("join-room", room);

  socket.on("state", (state) => {
    document.getElementById("question").textContent = state.question;
  });

  const input = document.getElementById("word");
  const statusEl = document.getElementById("status");

  function submit() {
    const val = input.value.trim();
    if (!val) return;
    socket.emit("submit-word", { room, word: val });
    input.value = "";
    statusEl.textContent = "Submitted! You can send another word for this question.";
    setTimeout(() => (statusEl.textContent = ""), 2500);
  }

  document.getElementById("submit-btn").onclick = submit;
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submit();
  });
</script>

</body>
</html>
