<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Events — Word Cloud Poll</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .topbar .who { font-size: 13px; color: var(--muted); }
  .topbar .who a { margin-left: 10px; }
  .ev-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-wrap: wrap;
  }
  .ev-row:last-child { border-bottom: none; }
  .ev-title { font-weight: 700; font-size: 17px; }
  .ev-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .badge {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .badge.active { background: #16351f; color: #6fe0a0; }
  .badge.idle { background: #2a2f3a; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="title-lg" style="margin:0;">My Events</div>
    <div class="who">Logged in as <b id="who"></b><a href="#" id="logout-link">Log out</a></div>
  </div>

  <div class="card">
    <label>New event name</label>
    <div class="row">
      <input type="text" id="event-title" placeholder="e.g. Team Offsite 2026" style="flex:1; min-width:200px;" />
      <button id="create-btn">Create event</button>
    </div>
  </div>

  <div class="card">
    <label style="margin-bottom:14px;">Your events</label>
    <div id="events-list"><p class="muted">Loading…</p></div>
  </div>
</div>

<script>
  function timeAgo(dateStr) {
    if (!dateStr) return "no responses yet";
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return `${days}d ago`;
  }

  async function init() {
    const meRes = await fetch("/api/auth/me");
    if (!meRes.ok) {
      location.href = "/login.html?next=/events.html";
      return;
    }
    const me = await meRes.json();
    document.getElementById("who").textContent = me.username;
    loadEvents();
  }

  async function loadEvents() {
    const res = await fetch("/api/events");
    if (!res.ok) return;
    const evs = await res.json();
    const list = document.getElementById("events-list");
    if (!evs.length) {
      list.innerHTML = '<p class="muted">No events yet — create your first one above.</p>';
      return;
    }
    list.innerHTML = "";
    evs.forEach((ev) => {
      const isActive = ev.lastActivity && Date.now() - new Date(ev.lastActivity).getTime() < 1000 * 60 * 60 * 24;
      const row = document.createElement("div");
      row.className = "ev-row";
      row.innerHTML = `
        <div>
          <div class="ev-title">${escapeHtml(ev.title)} <span class="badge ${isActive ? "active" : "idle"}">${isActive ? "Active" : "Idle"}</span></div>
          <div class="ev-meta">${ev.questionCount} question${ev.questionCount === 1 ? "" : "s"} &middot; ${ev.totalResponses} response${ev.totalResponses === 1 ? "" : "s"} &middot; last activity ${timeAgo(ev.lastActivity)}</div>
        </div>
        <a href="/dashboard.html?event=${ev.code}"><button>Open</button></a>
      `;
      list.appendChild(row);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("create-btn").onclick = async () => {
    const title = document.getElementById("event-title").value;
    const res = await fetch("/api/events", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title }),
    });
    const ev = await res.json();
    location.href = `/dashboard.html?event=${ev.code}`;
  };
  document.getElementById("event-title").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("create-btn").click();
  });

  document.getElementById("logout-link").onclick = async (e) => {
    e.preventDefault();
    await fetch("/api/auth/logout", { method: "POST" });
    location.href = "/login.html";
  };

  init();
</script>
</body>
</html>
