<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Dashboard</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .q-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .q-row:last-child { border-bottom: none; }
  .q-text { font-weight: 600; }
  .q-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .q-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .q-actions a button { padding: 8px 12px; font-size: 13px; }
  .code-box {
    display: inline-block;
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent2);
  }
</style>
</head>
<body>
<div class="container">
  <div class="row" style="justify-content:space-between; align-items:flex-start;">
    <div>
      <div class="title-lg" id="event-title">Loading…</div>
      <div class="muted">Event code: <span class="code-box" id="event-code"></span> (save this to come back later)</div>
    </div>
    <a href="/">&larr; New event</a>
  </div>

  <div class="card">
    <label>Add a question</label>
    <div class="row">
      <input type="text" id="new-question" placeholder="e.g. What's one word for how you feel about the roadmap?" style="flex:1; min-width:220px;" />
      <button id="add-btn">Add question</button>
    </div>
  </div>

  <div class="card">
    <label style="margin-bottom:14px;">Questions</label>
    <div id="questions-list"><p class="muted">No questions yet — add one above.</p></div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const eventId = params.get("event");
  if (!eventId) location.href = "/";

  async function loadEvent() {
    const res = await fetch(`/api/events/${eventId}`);
    if (!res.ok) {
      document.getElementById("event-title").textContent = "Event not found";
      return;
    }
    const ev = await res.json();
    document.getElementById("event-title").textContent = ev.title;
    document.getElementById("event-code").textContent = eventId;

    const list = document.getElementById("questions-list");
    if (!ev.questions.length) {
      list.innerHTML = '<p class="muted">No questions yet — add one above.</p>';
      return;
    }
    list.innerHTML = "";
    ev.questions.forEach((q) => {
      const row = document.createElement("div");
      row.className = "q-row";
      row.innerHTML = `
        <div>
          <div class="q-text">${escapeHtml(q.text)}</div>
          <div class="q-meta">${q.participantCount} participant${q.participantCount === 1 ? "" : "s"} &middot; ${q.responseCount} response${q.responseCount === 1 ? "" : "s"}</div>
        </div>
        <div class="q-actions">
          <a href="/present.html?event=${eventId}&q=${q.id}" target="_blank"><button>Present + QR</button></a>
          <button class="danger" data-id="${q.id}">Delete</button>
        </div>
      `;
      row.querySelector(".danger").onclick = async () => {
        if (!confirm("Delete this question?")) return;
        await fetch(`/api/events/${eventId}/questions/${q.id}`, { method: "DELETE" });
        loadEvent();
      };
      list.appendChild(row);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("add-btn").onclick = async () => {
    const text = document.getElementById("new-question").value.trim();
    if (!text) return;
    await fetch(`/api/events/${eventId}/questions`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    document.getElementById("new-question").value = "";
    loadEvent();
  };
  document.getElementById("new-question").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("add-btn").click();
  });

  loadEvent();
</script>
</body>
</html>
