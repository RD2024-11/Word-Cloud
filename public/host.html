<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Cloud — Host</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #7c8cff;
    --accent2: #ff8a65;
    --text: #f4f5f7;
    --muted: #9aa0ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at top left, #1b1f2a, #0f1115 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 24px 32px 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }
  .question-box {
    flex: 1;
    min-width: 280px;
  }
  .question-box label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  #question-display {
    font-size: 28px;
    font-weight: 700;
    margin: 4px 0 12px;
  }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  input[type="text"] {
    background: var(--panel);
    border: 1px solid #2a2f3a;
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    min-width: 240px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: #2a2f3a;
  }
  button:hover { opacity: 0.9; }

  .join-panel {
    background: var(--panel);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    min-width: 180px;
  }
  .join-panel #qrcode { display: inline-block; }
  .join-panel .link {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }
  .join-panel .code {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.1em;
    margin-top: 4px;
    color: var(--accent2);
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #cloud {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px 22px;
    max-width: 1100px;
  }
  .word {
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    transition: all 0.25s ease;
  }
  .empty-state {
    color: var(--muted);
    font-size: 18px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="question-box">
    <label>Current question</label>
    <div id="question-display">Loading…</div>
    <div class="controls">
      <input type="text" id="new-question" placeholder="Type a new question…" />
      <button id="set-question-btn">Update question</button>
      <button id="clear-btn" class="secondary">Clear responses</button>
    </div>
  </div>

  <div class="join-panel">
    <label style="font-size:12px; color:var(--muted);">Scan to answer</label>
    <div id="qrcode"></div>
    <div class="code" id="room-code"></div>
    <div class="link" id="join-link"></div>
  </div>
</header>

<main>
  <div id="cloud"><div class="empty-state">Waiting for responses…</div></div>
</main>

<footer>Word Cloud Poll — unlimited &amp; self-hosted</footer>

<script>
  const params = new URLSearchParams(location.search);
  const room = params.get("room") || Math.random().toString(36).slice(2, 7);
  if (!params.get("room")) {
    const url = new URL(location.href);
    url.searchParams.set("room", room);
    history.replaceState(null, "", url);
  }

  const joinUrl = `${location.origin}/join.html?room=${room}`;
  document.getElementById("room-code").textContent = room.toUpperCase();
  document.getElementById("join-link").textContent = joinUrl;
  new QRCode(document.getElementById("qrcode"), {
    text: joinUrl,
    width: 130,
    height: 130,
    colorDark: "#0f1115",
    colorLight: "#ffffff",
  });

  const socket = io();
  socket.emit("join-room", room);

  const colors = ["#7c8cff", "#ff8a65", "#4fd1c5", "#f6ad55", "#f687b3", "#68d391"];

  socket.on("state", (state) => {
    document.getElementById("question-display").textContent = state.question;

    const cloudEl = document.getElementById("cloud");
    if (!state.words.length) {
      cloudEl.innerHTML = '<div class="empty-state">Waiting for responses…</div>';
      return;
    }

    const counts = state.words.map((w) => w.count);
    const min = Math.min(...counts);
    const max = Math.max(...counts);

    cloudEl.innerHTML = "";
    state.words.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "word";
      const scale = max === min ? 0.5 : (w.count - min) / (max - min);
      const size = 18 + scale * 64; // 18px to 82px
      span.style.fontSize = size + "px";
      span.style.color = colors[i % colors.length];
      span.textContent = w.display;
      cloudEl.appendChild(span);
    });
  });

  document.getElementById("set-question-btn").onclick = () => {
    const val = document.getElementById("new-question").value;
    if (val.trim()) {
      socket.emit("set-question", { room, question: val });
      document.getElementById("new-question").value = "";
    }
  };

  document.getElementById("clear-btn").onclick = () => {
    if (confirm("Clear all responses for this question?")) {
      socket.emit("clear-words", { room });
    }
  };
</script>

</body>
</html>
